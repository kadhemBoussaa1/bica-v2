# Global settings for the Bicapack ERP proxy. The server blocks are in
# templates/<mode>/app.conf.template (rendered into conf.d at start), the
# routing they share in snippets/locations.conf.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS. With `resolve` on the upstream servers, nginx
    # re-resolves the service names every 10 s, so a container that comes back
    # with a new IP is followed without a reload (deploy.sh reloads anyway, to
    # skip the wait), and nginx starts even while the apps do not exist yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_upstream {
        zone upstream_api 64k;
        server api:3001 resolve;
        keepalive 16;
    }

    upstream web_upstream {
        zone upstream_web 64k;
        server web:3000 resolve;
        keepalive 16;
    }

    # Per client address. The whole factory may reach the server from one
    # NAT address, so these are sized for a shop floor, not one person: they
    # stop a password guesser or a runaway script, not a busy shift. Page and
    # API traffic get separate zones because their bursts differ: a page load
    # is one document then many chunks; the API is steady polling.
    limit_req_zone $binary_remote_addr zone=req_signin:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=req_api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=req_pages:10m rate=30r/s;
    limit_req_status 429;

    # Next compresses its own responses; the API's JSON is compressed here.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css text/plain application/javascript image/svg+xml;

    # The largest bodies are tRPC mutations and the invoice preview (256 kB,
    # main.ts). Files never pass through here: they go to S3 on presigned URLs.
    client_max_body_size 2m;

    include /etc/nginx/conf.d/app.conf;
}
