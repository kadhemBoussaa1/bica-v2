# Path routing, shared by the http and https server blocks.
#
# Web and API are served from ONE origin: apps/web/middleware.ts gates every
# page on the API's session cookie, and a cookie never crosses host names.
# None of the API prefixes below is a Next route.
#
# No `add_header` in this file: a location that sets one silently drops every
# header inherited from its server block (HSTS and the rest).

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# This is the edge: overwrite, never append. Whatever the client sent in
# X-Forwarded-For is discarded, which is what makes TRUST_PROXY=1 on the API
# (and Better Auth's own reading of the header) trustworthy.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# An app that is down (mid-deploy, crashed, maintenance flag) gets the
# maintenance page instead of a bare 502. Only nginx's own errors: a 5xx the
# app itself returns passes through untouched.
error_page 502 503 504 /__maintenance/maintenance.html;
location = /__maintenance/maintenance.html {
    internal;
    root /usr/share/nginx/html;
}

# Each proxied location checks the maintenance flag (deploy/maintenance.sh)
# itself. At server level the check would also catch the internal redirect
# to the maintenance page.

location = /api/auth/sign-in/email {
    if (-f /etc/nginx/state/maintenance) { return 503; }
    limit_req zone=req_signin burst=20 nodelay;
    proxy_pass http://api_upstream;
}

location /api/auth/ {
    if (-f /etc/nginx/state/maintenance) { return 503; }
    limit_req zone=req_api burst=100 nodelay;
    proxy_pass http://api_upstream;
}

location /trpc/ {
    if (-f /etc/nginx/state/maintenance) { return 503; }
    limit_req zone=req_api burst=100 nodelay;
    proxy_pass http://api_upstream;
}

# Generated PDFs. A first render of a long invoice takes a few seconds.
location /documents/ {
    if (-f /etc/nginx/state/maintenance) { return 503; }
    limit_req zone=req_api burst=100 nodelay;
    proxy_read_timeout 120s;
    proxy_pass http://api_upstream;
}

# Hashed build assets: many per page load, immutable, cache headers set by
# Next. Not rate limited.
location /_next/static/ {
    if (-f /etc/nginx/state/maintenance) { return 503; }
    proxy_pass http://web_upstream;
}

location / {
    if (-f /etc/nginx/state/maintenance) { return 503; }
    limit_req zone=req_pages burst=100 nodelay;
    proxy_pass http://web_upstream;
}
