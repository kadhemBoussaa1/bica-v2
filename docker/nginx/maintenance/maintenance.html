<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Served by nginx in place of the page that was asked for, so a refresh
     retries that page: users land back where they were once the apps are up. -->
<meta http-equiv="refresh" content="30">
<title>Bicapack ERP</title>
<style>
  :root { --bg: #f6f3ef; --card: #ffffff; --ink: #1f1a16; --muted: #6b625a; --accent: #c2410c; --line: rgba(31, 26, 22, 0.1); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171412; --card: #221e1b; --ink: #f3eee9; --muted: #b3a89e; --accent: #fb923c; --line: rgba(243, 238, 233, 0.12); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", sans-serif; }
  main { width: 100%; max-width: 30rem; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 32px; }
  .brand { margin: 0 0 24px; font-weight: 700; letter-spacing: 0.02em; color: var(--accent); }
  section + section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 1.25rem; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p class="brand">Bicapack ERP</p>
  <section>
    <h1>Mise à jour en cours</h1>
    <p>L'application revient dans quelques instants. Cette page se recharge toute seule.</p>
  </section>
  <section lang="ar" dir="rtl">
    <h1>تحديث قيد التنفيذ</h1>
    <p>سيعود التطبيق خلال لحظات. ستُعاد تحميل هذه الصفحة تلقائيًا.</p>
  </section>
  <section lang="en">
    <h1>Update in progress</h1>
    <p>The application will be back in a moment. This page reloads by itself.</p>
  </section>
</main>
</body>
</html>
