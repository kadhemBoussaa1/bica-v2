# The ship: once CI has passed on a push to main, build the three images,
# push them to GHCR, then redeploy the server over SSH. Separate from ci.yml
# so that a pull request never builds an image or sees the production
# secrets; triggered by CI's completion so that nothing red is ever deployed.
# Run it by hand (workflow_dispatch) to redeploy the current main.
#
# Needs a GitHub Environment named `production` holding:
#   secrets  SSH_HOST, SSH_USER (the deploy user), SSH_KEY (its private key),
#            SSH_FINGERPRINT (the server's host key, so CI never trusts an
#            impostor: ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub | cut -d' ' -f2)
#   vars     PUBLIC_URL, e.g. https://erp.example.com. Baked into the web
#            image, so it must match DOMAIN in the server's .env.production.

name: Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  # workflow_run fires on the default branch's context: github.sha is main's
  # tip at that moment, not necessarily the commit CI just passed.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

# Never cancel a deploy halfway; a newer push waits its turn.
concurrency:
  group: docker-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: runner-api, image: api }
          - { target: runner-web, image: web }
          - { target: runner-migrate, image: migrate }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # GHCR names must be lowercase; the owner in github.repository may not be.
      - name: Image name
        id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags: `main` moves with every build; `main-<sha>` never moves and
      # is what deploy.sh --tag deploys and rolls back to.
      #
      # One cache scope per image rather than one shared: the three jobs run at
      # once, and on a shared scope the last to finish overwrites the others'
      # cache manifest, so the shared stages would hit only by luck.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.name.outputs.prefix }}-${{ matrix.image }}:main
            ${{ steps.name.outputs.prefix }}-${{ matrix.image }}:main-${{ env.SHA }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.PUBLIC_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Check out the built commit first, so the compose file, nginx config
      # and scripts match the images; deploy.sh starts after the checkout, so
      # it never runs half-updated.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -e
            cd /srv/bicapack/app
            git fetch origin main
            git merge --ff-only ${{ env.SHA }}
            ./deploy/deploy.sh --tag main-${{ env.SHA }}
