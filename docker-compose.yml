services:
  postgres:
    image: postgres:16-alpine
    container_name: bica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bica
      POSTGRES_PASSWORD: bica_dev_password
      POSTGRES_DB: bica
    # Host port 5433 avoids colliding with an existing local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bica -d bica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
